const CAMPS = ["All","916","936","1178"];
let cur = "All", charts = {};
const sum = (rs,i) => rs.reduce((a,r)=>a+r[i],0);
const div = (a,b) => b ? a/b : 0;

function group(rs, idx){
  const m = {};
  rs.forEach(r => (m[r[idx]] = m[r[idx]] || []).push(r));
  return Object.keys(m).sort().map(k => ({k, cpa: div(sum(m[k],5), sum(m[k],7)), ctr: div(sum(m[k],4), sum(m[k],3))*100}));
}
function draw(id, labels, data, color){
  if (typeof Chart === "undefined") return;   // KPIs still work if CDN fails
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(document.getElementById(id), {type:"bar",
    data:{labels, datasets:[{data, backgroundColor:color}]},
    options:{plugins:{legend:{display:false}}}});
}
function render(){
  const rs = cur==="All" ? ROWS : ROWS.filter(r => r[0]===cur);
  const spend = sum(rs,5), sales = sum(rs,7), clicks = sum(rs,4), imp = sum(rs,3);
  document.getElementById("kpis").innerHTML = [
    ["$"+Math.round(spend).toLocaleString(),"Total spend"],
    [clicks.toLocaleString(),"Clicks"],
    [sales.toLocaleString(),"Sales"],
    [div(clicks,imp)*100 > 0 ? (div(clicks,imp)*100).toFixed(3)+"%" : "0%","CTR"],
    ["$"+div(spend,sales).toFixed(2),"Cost per sale"]
  ].map(x => `<div class="k"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("");
  document.getElementById("note").textContent = cur==="916" ?
    "Caution: campaign 916 is tiny (54 ads, ~$150 spend), so its low cost per sale is not reliable." : "";
  const a = group(rs,1), g = group(rs,2);
  draw("c1", a.map(x=>x.k), a.map(x=>+x.cpa.toFixed(2)), "#1877f2");
  draw("c2", g.map(x=>x.k), g.map(x=>+x.cpa.toFixed(2)), ["#e91e63","#1877f2"]);
  draw("c3", a.map(x=>x.k), a.map(x=>+x.ctr.toFixed(3)), "#42b72a");
}
document.getElementById("btns").innerHTML = CAMPS.map(c => `<button data-c="${c}">${c==="All"?"All campaigns":"Campaign "+c}</button>`).join("");
document.querySelectorAll("button").forEach(b => b.onclick = () => {
  cur = b.dataset.c;
  document.querySelectorAll("button").forEach(x => x.classList.toggle("on", x===b));
  render();
});
document.querySelector("button").classList.add("on");
render();
